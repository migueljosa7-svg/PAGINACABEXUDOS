# =============================================================================
# PAGINACABEXUDOS - Production Docker Compose
# =============================================================================
#
# Deploys the full application (React frontend + GPS Relay WebSocket) on a single server.
#
# Usage:
#   docker-compose up -d              # Start all services
#
# Environment file (.env — never commit real tokens, see .env.example):
#   PORT=3001
#   LOG_LEVEL=info
#   CORS_ORIGIN=https://paginacabexudos.onrender.com
#   AUTHORIZED_GPS_DEVICES={"<64-hex-token>": {"name": "Recorrido Oficial"}}
#   HEALTH_TOKEN=<64-hex-token>
# Generate fresh values with: npm run generate-env
# =============================================================================

services:
  # ===========================================================================
  # Full Application - React frontend + GPS Relay WebSocket
  # ===========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Variables de build del frontend (Vite las incrusta en el bundle).
      args:
        VITE_WS_RELAY_URL: ${VITE_WS_RELAY_URL:-}
        VITE_VIEWER_TRANSPORT: ${VITE_VIEWER_TRANSPORT:-sse}
        VITE_GPS_TOKEN: ${VITE_GPS_TOKEN:-}
    container_name: paginacabexudos
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CORS_ORIGIN=*
      - CLEANUP_INTERVAL=60000
      - ROOM_IDLE_TTL=300000
      - MAX_CONN_PER_IP=${MAX_CONN_PER_IP:-6}
      - MAX_TOTAL_CLIENTS=${MAX_TOTAL_CLIENTS:-2000}
      - AUTHORIZED_GPS_DEVICES=${AUTHORIZED_GPS_DEVICES:-}
    healthcheck:
      # La imagen final es node:20-alpine: usa wget de busybox (no hay curl).
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - paginacabexudos-net

networks:
  paginacabexudos-net:
    driver: bridge
